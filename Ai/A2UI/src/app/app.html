<main class="app-container">
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-panel">
    <header>
      <h1 class="title">Tasks</h1>
      <p class="subtitle">Stay organized, focused, and productive.</p>
    </header>

    <div class="input-group">
      <input 
        type="text" 
        [ngModel]="newTodoTitle()"
        (ngModelChange)="newTodoTitle.set($event)"
        (keyup.enter)="addTodo()"
        placeholder="What needs to be done?"
        class="todo-input"
        autofocus
      />
      <button class="add-btn" (click)="addTodo()" [disabled]="!newTodoTitle().trim()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="filters">
      <button [class.active]="filter() === 'all'" (click)="setFilter('all')">All</button>
      <button [class.active]="filter() === 'active'" (click)="setFilter('active')">Active</button>
      <button [class.active]="filter() === 'completed'" (click)="setFilter('completed')">Completed</button>
    </div>

    <ul class="todo-list">
      @for (todo of filteredTodos(); track todo.id) {
        <li class="todo-item" [class.completed]="todo.completed">
          <label class="checkbox-container">
            <input type="checkbox" [checked]="todo.completed" (change)="toggleTodo(todo.id)" />
            <span class="checkmark">
              <svg *ngIf="todo.completed" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          </label>
          <span class="todo-text">{{ todo.title }}</span>
          <button class="delete-btn" (click)="removeTodo(todo.id)" aria-label="Delete todo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
          </button>
        </li>
      } @empty {
        <div class="empty-state">
          <div class="empty-icon">✨</div>
          <p>No tasks found. Enjoy your day!</p>
        </div>
      }
    </ul>

    <footer class="footer">
      <span class="count">{{ activeCount() }} {{ activeCount() === 1 ? 'item' : 'items' }} left</span>
      @if (todos().length > activeCount()) {
        <button class="clear-btn" (click)="clearCompleted()">Clear completed</button>
      }
    </footer>
  </div>
</main>

<div class="copilot-chat-container">
  <copilot-chat />
</div>
