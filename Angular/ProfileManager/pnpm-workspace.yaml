allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  re2: true
# @firebase/firestore pins @grpc/grpc-js to ~1.9 (vulnerable, GHSA-m9gg-hp2v-232j and
# GHSA-f596-whhp-79r4, patched in 1.13.6) and its latest release still does. Only Node code
# paths (the rules tests) load it; the browser bundle uses the WebChannel transport.
overrides:
  '@grpc/grpc-js': 1.13.7
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.0'
  - '@angular-devkit/core@22.2.0'
  - '@angular-devkit/schematics@22.2.0'
  - '@angular/build@22.2.0'
  - '@angular/cdk@22.2.0'
  - '@angular/cli@22.2.0'
  - '@angular/common@22.2.0'
  - '@angular/compiler-cli@22.2.0'
  - '@angular/compiler@22.2.0'
  - '@angular/core@22.2.0'
  - '@angular/forms@22.2.0'
  - '@angular/platform-browser@22.2.0'
  - '@angular/router@22.2.0'
  - '@schematics/angular@22.2.0'
  - firebase-tools@15.31.0
