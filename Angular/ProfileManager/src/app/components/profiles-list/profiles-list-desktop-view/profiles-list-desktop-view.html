<div
  class="mt-5 grid grid-cols-1 gap-5 transition-opacity motion-reduce:transition-none sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"
  [class.opacity-60]="isLoading() && pagedData().length > 0"
  [attr.aria-busy]="isLoading()"
>
  @if (isLoading() && pagedData().length === 0) {
    @for (card of skeletonRows; track $index) {
      <div class="glass flex flex-col gap-4 rounded-2xl p-4">
        <div class="flex items-center gap-3">
          <div hlmSkeleton class="size-11 rounded-xl"></div>
          <div class="flex flex-1 flex-col gap-2">
            <div hlmSkeleton class="h-4 w-3/4"></div>
            <div hlmSkeleton class="h-3 w-1/2"></div>
          </div>
          <div hlmSkeleton class="size-11 rounded-full"></div>
        </div>
        <div hlmSkeleton class="h-5 w-2/3"></div>
        <div hlmSkeleton class="h-8 w-full"></div>
      </div>
    }
  } @else {
    @for (profile of pagedData(); track profile.id) {
      <article
        data-testid="profile-card"
        class="glass focus-within:border-ring relative flex flex-col gap-3 overflow-hidden rounded-2xl p-4 transition-all motion-safe:hover:-translate-y-1 hover:border-primary/50"
      >
        <span aria-hidden="true" [class]="profile | profileStatusEdge"></span>

        <!-- Header: avatar, name + ID, score ring -->
        <div class="flex min-h-11 items-center gap-3">
          <app-profile-avatar [name]="profile.name" [size]="44" />
          <div class="flex min-w-0 flex-1 flex-col items-start gap-0.5">
            <h3 class="w-full truncate text-base leading-tight font-semibold">
              {{ profile.name }}
            </h3>
            <button
              type="button"
              class="text-muted-foreground hover:text-foreground focus-visible:ring-ring/50 inline-flex max-w-full items-center gap-1 rounded text-xs leading-4 outline-none focus-visible:ring-[3px]"
              aria-label="Copy matrimony ID"
              (click)="copyToClipboard(profile.matrimonyId, 'Matrimony ID')"
            >
              {{ profile.matrimonyId }}
              <ng-icon hlm name="lucideCopy" size="xs" />
            </button>
          </div>
          <span
            class="flex shrink-0"
            hlmTooltip="Compatibility score between the couple's star signs. Higher is better."
          >
            <app-score-ring showEmpty [score]="profile.starMatchScore ?? null" [size]="44" />
          </span>
        </div>

        <!-- Status, zodiac, city -->
        <div class="flex h-6 items-center gap-3 text-sm">
          <app-status-menu
            class="inline-flex h-6 shrink-0 items-center"
            [profileId]="`${profile.id}`"
            [statusId]="profile.profileStatusId"
          />
          <span class="text-muted-foreground flex shrink-0 items-center gap-2">
            <span class="grid size-4 shrink-0 place-items-center">
              <span [class]="profile.zodiacSign | zodiacColor">
                <ng-icon hlm size="sm" [name]="profile.zodiacSign | zodiacIcon" />
              </span>
            </span>
            {{ profile.zodiacSign | titlecase }}
          </span>
          <span class="text-muted-foreground flex min-w-0 items-center gap-2">
            <span class="grid size-4 shrink-0 place-items-center">
              <ng-icon hlm name="lucideMapPin" size="sm" />
            </span>
            <span class="truncate" [attr.title]="profile.city">{{ profile.city }}</span>
          </span>
        </div>

        <!-- Mobile number + contact actions -->
        <div class="bg-muted/40 flex h-10 items-center justify-between gap-2 rounded-lg px-3">
          <span class="min-w-0 truncate text-sm">{{ profile.mobileNumber }}</span>
          <div class="-mr-2 flex shrink-0 items-center">
            <button
              type="button"
              hlmBtn
              hlmTooltip="Copy"
              variant="ghost"
              size="icon-sm"
              aria-label="Copy mobile number"
              (click)="copyToClipboard(profile.mobileNumber, 'Mobile Number')"
            >
              <ng-icon hlm name="lucideCopy" size="sm" />
            </button>
            <a
              hlmBtn
              hlmTooltip="Call"
              variant="ghost"
              size="icon-sm"
              aria-label="Call"
              [href]="profile.mobileNumber | mobileUrl: 'tel'"
            >
              <ng-icon hlm name="lucidePhone" size="sm" />
            </a>
            <a
              hlmBtn
              hlmTooltip="WhatsApp"
              variant="ghost"
              size="icon-sm"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
              class="text-green-700 dark:text-green-400"
              [href]="profile.mobileNumber | mobileUrl: 'whatsapp'"
            >
              <ng-icon hlm name="lucideMessageCircle" size="sm" />
            </a>
          </div>
        </div>

        <!-- Footer actions -->
        <div class="border-border flex items-center gap-2 border-t pt-3">
          <button
            type="button"
            hlmBtn
            variant="outline"
            size="sm"
            aria-label="View"
            (click)="userActionEvent('view', profile.id)"
          >
            <ng-icon hlm name="lucideEye" size="sm" />
            View
          </button>
          <button
            type="button"
            hlmBtn
            variant="outline"
            size="sm"
            aria-label="Edit"
            (click)="userActionEvent('edit', profile.id)"
          >
            <ng-icon hlm name="lucideSquarePen" size="sm" />
            Edit
          </button>
          <button
            type="button"
            hlmBtn
            hlmTooltip="Delete profile"
            variant="ghost"
            size="icon-sm"
            aria-label="Delete"
            class="text-destructive hover:text-destructive ml-auto"
            (click)="userActionEvent('delete', profile.id)"
          >
            <ng-icon hlm name="lucideTrash2" size="sm" />
          </button>
        </div>
      </article>
    } @empty {
      <app-profiles-empty-state />
    }
  }
</div>
