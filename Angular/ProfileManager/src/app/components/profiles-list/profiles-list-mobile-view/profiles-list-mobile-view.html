@if (isLoading() && pagedData().length === 0) {
  <div class="mt-4 flex flex-col gap-3">
    @for (card of skeletonRows; track $index) {
      <div class="glass flex flex-col gap-3 rounded-2xl p-3">
        <div class="flex items-center gap-3">
          <div hlmSkeleton class="size-10 rounded-xl"></div>
          <div class="flex flex-1 flex-col gap-2">
            <div hlmSkeleton class="h-4 w-3/4"></div>
            <div hlmSkeleton class="h-3 w-1/2"></div>
          </div>
          <div hlmSkeleton class="size-10 rounded-full"></div>
        </div>
        <div hlmSkeleton class="h-5 w-2/3"></div>
      </div>
    }
  </div>
} @else {
  <div
    class="mt-4 flex w-full flex-col gap-3 transition-opacity motion-reduce:transition-none"
    [class.opacity-60]="isLoading()"
    [attr.aria-busy]="isLoading()"
  >
    @for (profile of pagedData(); track profile.id) {
      <div
        role="button"
        data-testid="profile-card"
        tabindex="0"
        class="glass focus-visible:ring-ring/50 relative flex cursor-pointer flex-col gap-3 overflow-hidden rounded-2xl p-3 outline-none focus-visible:ring-[3px]"
        (click)="userActionEvent('view', profile.id)"
        (keydown.enter)="userActionEvent('view', profile.id)"
      >
        <span aria-hidden="true" [class]="profile | profileStatusEdge"></span>

        <!-- Header: avatar, name + ID, score ring, kebab -->
        <div class="flex items-center gap-3">
          <app-profile-avatar [name]="profile.name" [size]="40" />
          <div class="flex min-w-0 flex-1 flex-col items-start gap-0.5">
            <div class="w-full truncate text-base leading-tight font-semibold">
              {{ profile.name }}
            </div>
            <button
              type="button"
              class="text-muted-foreground inline-flex items-center gap-1 text-xs"
              aria-label="Copy matrimony ID"
              (click)="
                $event.stopPropagation(); copyToClipboard(profile.matrimonyId, 'Matrimony ID')
              "
            >
              {{ profile.matrimonyId }}
              <ng-icon hlm name="lucideCopy" size="xs" />
            </button>
          </div>
          <app-score-ring [score]="profile.starMatchScore ?? null" [size]="40" />
          <div class="-my-2 -mr-2 flex shrink-0 items-center">
            <button
              type="button"
              hlmBtn
              variant="ghost"
              class="size-11"
              aria-label="View"
              (click)="$event.stopPropagation(); userActionEvent('view', profile.id)"
              (keydown.enter)="$event.stopPropagation()"
            >
              <ng-icon hlm name="lucideEye" size="sm" />
            </button>
            <button
              type="button"
              hlmBtn
              variant="ghost"
              class="size-11"
              aria-label="More actions"
              [hlmDropdownMenuTrigger]="profileMenu"
              (click)="$event.stopPropagation()"
              (keydown.enter)="$event.stopPropagation()"
            >
              <ng-icon hlm name="lucideMoreVertical" size="sm" />
            </button>
          </div>
          <ng-template #profileMenu>
            <hlm-dropdown-menu>
              <button
                type="button"
                hlmDropdownMenuItem
                (click)="userActionEvent('edit', profile.id)"
              >
                <ng-icon hlm name="lucidePencil" size="sm" />
                Edit
              </button>
              <button
                type="button"
                hlmDropdownMenuItem
                class="text-destructive focus:text-destructive"
                (click)="userActionEvent('delete', profile.id)"
              >
                <ng-icon hlm name="lucideTrash2" size="sm" />
                Delete
              </button>
            </hlm-dropdown-menu>
          </ng-template>
        </div>

        <!-- Status, zodiac, city -->
        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
          <app-status-menu [profileId]="`${profile.id}`" [statusId]="profile.profileStatusId" />
          <span class="text-muted-foreground flex items-center gap-1">
            <span [class]="profile.zodiacSign | zodiacColor">
              <ng-icon hlm size="sm" [name]="profile.zodiacSign | zodiacIcon" />
            </span>
            {{ profile.zodiacSign | titlecase }}
          </span>
          <span class="text-muted-foreground flex items-center gap-1">
            <ng-icon hlm name="lucideMapPin" size="sm" />
            {{ profile.city }}
          </span>
        </div>

        <!-- Mobile number + contact actions -->
        <div class="bg-muted/40 flex items-center justify-between gap-1 rounded-lg py-1 pr-1 pl-3">
          <span class="truncate text-sm">{{ profile.mobileNumber }}</span>
          <div class="flex shrink-0 items-center">
            <button
              type="button"
              hlmBtn
              variant="ghost"
              size="icon-sm"
              aria-label="Copy mobile number"
              (click)="
                $event.stopPropagation(); copyToClipboard(profile.mobileNumber, 'Mobile Number')
              "
            >
              <ng-icon hlm name="lucideCopy" size="sm" />
            </button>
            <a
              hlmBtn
              variant="ghost"
              size="icon-sm"
              aria-label="Call"
              [href]="profile.mobileNumber | mobileUrl: 'tel'"
              (click)="$event.stopPropagation()"
            >
              <ng-icon hlm name="lucidePhone" size="sm" />
            </a>
            <a
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="text-green-700 dark:text-green-400"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
              [href]="profile.mobileNumber | mobileUrl: 'whatsapp'"
              (click)="$event.stopPropagation()"
            >
              <ng-icon hlm name="lucideMessageCircle" size="sm" />
            </a>
          </div>
        </div>
      </div>
    } @empty {
      <app-profiles-empty-state />
    }
  </div>
}
