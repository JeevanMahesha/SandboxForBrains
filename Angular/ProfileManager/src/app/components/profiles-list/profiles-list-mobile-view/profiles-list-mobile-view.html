@if (isLoading() && pagedData().length === 0) {
  <div class="mt-5 flex flex-col gap-5">
    @for (card of skeletonRows; track $index) {
      <div class="glass flex flex-col gap-3 rounded-2xl p-4">
        <div class="flex items-center gap-3">
          <div hlmSkeleton class="size-10 rounded-xl"></div>
          <div class="flex flex-1 flex-col gap-2">
            <div hlmSkeleton class="h-4 w-3/4"></div>
            <div hlmSkeleton class="h-3 w-1/2"></div>
          </div>
          <div hlmSkeleton class="size-10 rounded-full"></div>
        </div>
        <div hlmSkeleton class="h-5 w-2/3"></div>
      </div>
    }
  </div>
} @else {
  <div
    class="mt-5 flex w-full flex-col gap-5 transition-opacity motion-reduce:transition-none"
    [class.opacity-60]="isLoading()"
    [attr.aria-busy]="isLoading()"
  >
    @for (profile of pagedData(); track profile.id) {
      <!--
        The card is not itself a button (a button wrapping buttons and links is invalid). The View
        button below is the one control that opens the profile; its ::after stretches over the whole
        card so a tap anywhere opens it, while the other controls sit above it with z-10. The
        Button's pressed-state nudge (translate-y-px) is cancelled on it: a transform would make
        the button the ::after's containing block, shrinking the overlay on press and losing the tap.
      -->
      <div
        data-testid="profile-card"
        class="glass has-[[data-card-view]:focus-visible]:ring-ring/50 relative flex cursor-pointer flex-col gap-3 overflow-hidden rounded-2xl p-4 has-[[data-card-view]:focus-visible]:ring-[3px]"
      >
        <span aria-hidden="true" [class]="profile | profileStatusEdge"></span>

        <!-- Header: avatar, name + ID, score ring, kebab -->
        <div class="flex min-h-11 items-center gap-3">
          <app-profile-avatar [name]="profile.name" [size]="40" />
          <div class="flex min-w-0 flex-1 flex-col items-start gap-0.5">
            <div class="w-full truncate text-base leading-tight font-semibold">
              {{ profile.name }}
            </div>
            <button
              type="button"
              class="text-muted-foreground relative z-10 inline-flex max-w-full items-center gap-1 text-xs leading-4 after:absolute after:-inset-x-2 after:-inset-y-3.5 after:content-['']"
              [attr.aria-label]="`Copy matrimony ID of ${profile.name}`"
              (click)="copyToClipboard(profile.matrimonyId, 'Matrimony ID')"
            >
              {{ profile.matrimonyId }}
              <ng-icon hlm name="lucideCopy" size="xs" />
            </button>
          </div>
          <app-score-ring showEmpty [score]="profile.starMatchScore ?? null" [size]="40" />
          <div class="-my-2 -mr-2 flex shrink-0 items-center">
            <button
              type="button"
              hlmBtn
              variant="ghost"
              class="size-11 after:absolute after:inset-0 after:content-[''] active:not-aria-[haspopup]:[translate:none]!"
              data-card-view
              [attr.aria-label]="`View ${profile.name}`"
              (click)="userActionEvent('view', profile.id)"
            >
              <ng-icon hlm name="lucideEye" size="sm" />
            </button>
            <button
              type="button"
              hlmBtn
              variant="ghost"
              class="relative z-10 size-11"
              [attr.aria-label]="`More actions for ${profile.name}`"
              [hlmDropdownMenuTrigger]="profileMenu"
            >
              <ng-icon hlm name="lucideMoreVertical" size="sm" />
            </button>
          </div>
          <ng-template #profileMenu>
            <hlm-dropdown-menu>
              <button
                type="button"
                hlmDropdownMenuItem
                (click)="userActionEvent('edit', profile.id)"
              >
                <ng-icon hlm name="lucidePencil" size="sm" />
                Edit
              </button>
              <button
                type="button"
                hlmDropdownMenuItem
                class="text-destructive focus:text-destructive"
                (click)="userActionEvent('delete', profile.id)"
              >
                <ng-icon hlm name="lucideTrash2" size="sm" />
                Delete
              </button>
            </hlm-dropdown-menu>
          </ng-template>
        </div>

        <!-- Status, zodiac, city -->
        <div class="flex min-h-6 flex-wrap items-center gap-x-3 gap-y-1 text-sm">
          <app-status-menu
            class="relative z-10 inline-flex h-6 shrink-0 items-center"
            [profileId]="`${profile.id}`"
            [statusId]="profile.profileStatusId"
          />
          <span class="text-muted-foreground flex min-w-0 items-center gap-2">
            <span class="grid size-4 shrink-0 place-items-center">
              <span [class]="profile.zodiacSign | zodiacColor">
                <ng-icon hlm size="sm" [name]="profile.zodiacSign | zodiacIcon" />
              </span>
            </span>
            <span class="truncate" [attr.title]="profile.zodiacSign | zodiacLabel">{{
              profile.zodiacSign | zodiacLabel
            }}</span>
          </span>
          <span class="text-muted-foreground flex min-w-0 items-center gap-2">
            <span class="grid size-4 shrink-0 place-items-center">
              <ng-icon hlm name="lucideMapPin" size="sm" />
            </span>
            <span class="truncate" [attr.title]="profile.city">{{ profile.city }}</span>
          </span>
        </div>

        <!-- Mobile number + contact actions -->
        <div class="bg-muted/40 flex h-10 items-center justify-between gap-2 rounded-lg px-3">
          <span class="min-w-0 truncate text-sm">{{ profile.mobileNumber }}</span>
          <div class="relative z-10 -mr-2 flex shrink-0 items-center">
            <button
              type="button"
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="size-11"
              [attr.aria-label]="`Copy mobile number of ${profile.name}`"
              (click)="copyToClipboard(profile.mobileNumber, 'Mobile Number')"
            >
              <ng-icon hlm name="lucideCopy" size="sm" />
            </button>
            <a
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="size-11"
              [attr.aria-label]="`Call ${profile.name}`"
              [href]="profile.mobileNumber | mobileUrl: 'tel'"
            >
              <ng-icon hlm name="lucidePhone" size="sm" />
            </a>
            <a
              hlmBtn
              variant="ghost"
              size="icon-sm"
              class="size-11 text-green-700 dark:text-green-400"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="`WhatsApp ${profile.name}`"
              [href]="profile.mobileNumber | mobileUrl: 'whatsapp'"
            >
              <ng-icon hlm name="lucideMessageCircle" size="sm" />
            </a>
          </div>
        </div>
      </div>
    } @empty {
      @if (!hasError()) {
        <app-profiles-empty-state />
      }
    }
  </div>
}
