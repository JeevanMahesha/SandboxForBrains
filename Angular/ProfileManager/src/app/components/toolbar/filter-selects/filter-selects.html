<label class="sr-only" [for]="triggerId()">Star match score</label>
<hlm-select placeholder="Star match score" [formField]="starMatchScore()">
  <hlm-select-trigger class="w-full md:w-36 lg:w-40" [buttonId]="triggerId()">
    <hlm-select-value placeholder="Star match score" />
  </hlm-select-trigger>
  <hlm-select-content *hlmSelectPortal>
    <hlm-select-item [value]="null">Any score</hlm-select-item>
    @for (score of scoreMatchOptions; track score) {
      <hlm-select-item [value]="score">{{ score }}</hlm-select-item>
    }
  </hlm-select-content>
</hlm-select>
