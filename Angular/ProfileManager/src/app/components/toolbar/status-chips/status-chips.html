<div role="group" aria-label="Profile status" class="flex flex-wrap gap-1.5">
  <button
    type="button"
    [class]="chipClass"
    [class.bg-gradient-brand]="profileStatus()().value() === null"
    [class.text-primary-foreground]="profileStatus()().value() === null"
    [class.border-transparent!]="profileStatus()().value() === null"
    [attr.aria-pressed]="profileStatus()().value() === null"
    (click)="select(null)"
  >
    All
  </button>
  @for (option of options; track option.key) {
    @let active = profileStatus()().value() === option.key;
    <button
      type="button"
      [class]="chipClass"
      [class.bg-gradient-brand]="active"
      [class.text-primary-foreground]="active"
      [class.border-transparent!]="active"
      [attr.aria-pressed]="active"
      (click)="select(option.key)"
    >
      {{ option.label }}
    </button>
  }
</div>
