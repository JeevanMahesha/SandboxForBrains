<div class="glass flex flex-col gap-3 rounded-2xl p-3">
  <div class="flex flex-wrap items-center gap-2">
    <!-- Theme toggle (visible on all sizes) -->
    <button
      type="button"
      hlmBtn
      variant="outline"
      size="icon"
      class="shrink-0"
      [attr.aria-label]="`Theme: ${themeService.preference()}`"
      [attr.title]="`Theme: ${themeService.preference()}`"
      (click)="themeService.cyclePreference()"
    >
      <ng-icon hlm size="sm" [name]="themeIcon()" />
    </button>

    <!-- Search (desktop only; on mobile it lives in the Filters sheet) -->
    <div class="relative hidden md:block md:w-72">
      <ng-icon
        hlm
        name="lucideSearch"
        size="sm"
        class="text-muted-foreground pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2"
      />
      <input
        hlmInput
        type="text"
        placeholder="Search by ID or phone"
        class="w-full pl-8"
        [formField]="filterForm.searchQuery"
      />
    </div>

    <span class="hidden flex-1 md:block"></span>

    <!-- Mobile: Filters button -->
    <button
      type="button"
      hlmBtn
      variant="outline"
      class="relative flex-1 md:hidden"
      (click)="filterSheetOpen.set('open')"
    >
      <ng-icon hlm name="lucideSlidersHorizontal" size="sm" />
      Filters
      @if (filterHasValue()) {
        <span hlmBadge class="absolute -top-2 -right-2 size-5 rounded-full p-0 text-[10px]">!</span>
      }
    </button>

    <div class="order-last flex w-full md:order-none md:w-auto">
      <button
        type="button"
        hlmBtn
        class="flex-1 rounded-r-none md:flex-none"
        (click)="addNewProfileAction()"
      >
        <ng-icon hlm name="lucideUserPlus" size="sm" />
        Add Profile
      </button>
      <button
        #moreActionsBtn
        type="button"
        hlmBtn
        class="rounded-l-none border-l border-l-primary-foreground/20 px-2"
        aria-label="More actions"
        [hlmDropdownMenuTrigger]="addMenu"
      >
        <ng-icon hlm name="lucideChevronDown" size="sm" />
      </button>
      @defer (when toggleStarMatch() === 'open') {
        <app-star-match
          [togglePopover]="toggleStarMatch()"
          [attachTo]="moreActionsBtn"
          (starMatchHidden)="toggleStarMatch.set('closed')"
        />
      }
      @defer (when toggleZodiacSigns() === 'open') {
        <app-zodiac-signs
          [togglePopover]="toggleZodiacSigns()"
          [attachTo]="moreActionsBtn"
          (zodiacSignsHidden)="toggleZodiacSigns.set('closed')"
        />
      }
      <ng-template #addMenu>
        <hlm-dropdown-menu class="min-w-44">
          <button type="button" hlmDropdownMenuItem (click)="openZodiacSignPopover()">
            <ng-icon hlm name="lucideSparkles" size="sm" />
            Zodiac Signs
          </button>
          <button type="button" hlmDropdownMenuItem (click)="openStarMatchPopover()">
            <ng-icon hlm name="lucideStar" size="sm" />
            Preferred Star
          </button>
        </hlm-dropdown-menu>
      </ng-template>
    </div>

    <!-- Account menu -->
    <button
      type="button"
      hlmBtn
      variant="outline"
      size="icon"
      class="shrink-0"
      aria-label="Account menu"
      [hlmDropdownMenuTrigger]="accountMenu"
    >
      <ng-icon hlm name="lucideUser" size="sm" />
    </button>
    <ng-template #accountMenu>
      <hlm-dropdown-menu class="min-w-56">
        @if (authService.user()?.email; as email) {
          <div hlmDropdownMenuLabel class="truncate">{{ email }}</div>
          <hlm-dropdown-menu-separator />
        }
        <button type="button" hlmDropdownMenuItem (click)="logout()">
          <ng-icon hlm name="lucideLogOut" size="sm" />
          Log Out
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  </div>

  <!-- Desktop filters: status chips + sort, star match, clear -->
  <div class="hidden flex-wrap items-center justify-between gap-3 md:flex">
    <app-status-chips [profileStatus]="filterForm.profileStatus" />
    <div class="flex items-center gap-2">
      <hlm-select [formField]="filterForm.viewOrderCheck" [itemToString]="sortOrderToLabel">
        <hlm-select-trigger class="w-40">
          <hlm-select-value placeholder="Sort order" />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item [value]="true">Newest First</hlm-select-item>
          <hlm-select-item [value]="false">Oldest First</hlm-select-item>
        </hlm-select-content>
      </hlm-select>
      <app-filter-selects [starMatchScore]="filterForm.starMatchScore" />
      <button
        type="button"
        hlmBtn
        variant="outline"
        [disabled]="!filterHasValue()"
        (click)="clearForm()"
      >
        <ng-icon hlm name="lucideFilterX" size="sm" />
        Clear
      </button>
    </div>
  </div>
</div>

<!-- Mobile filter sheet (bottom) -->
<hlm-sheet side="bottom" [state]="filterSheetOpen()" (closed)="filterSheetOpen.set('closed')">
  <hlm-sheet-content
    *brnSheetContent
    class="flex max-h-[85vh] flex-col gap-4 overflow-y-auto px-4 pb-6"
  >
    <hlm-sheet-header>
      <h3 hlmSheetTitle>Filters</h3>
    </hlm-sheet-header>

    <div class="flex flex-col gap-4">
      <div class="relative">
        <ng-icon
          hlm
          name="lucideSearch"
          size="sm"
          class="text-muted-foreground pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2"
        />
        <input
          hlmInput
          type="text"
          placeholder="Search by ID or phone"
          class="w-full pl-8"
          [formField]="filterForm.searchQuery"
        />
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-muted-foreground text-xs font-semibold uppercase">Sort</span>
        <hlm-select [formField]="filterForm.viewOrderCheck" [itemToString]="sortOrderToLabel">
          <hlm-select-trigger class="w-full">
            <hlm-select-value placeholder="Sort order" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-item [value]="true">Newest First</hlm-select-item>
            <hlm-select-item [value]="false">Oldest First</hlm-select-item>
          </hlm-select-content>
        </hlm-select>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-muted-foreground text-xs font-semibold uppercase">Profile Status</span>
        <app-status-chips [profileStatus]="filterForm.profileStatus" />
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-muted-foreground text-xs font-semibold uppercase">Star Match Score</span>
        <app-filter-selects [starMatchScore]="filterForm.starMatchScore" />
      </div>
    </div>

    <hlm-sheet-footer>
      <button
        type="button"
        hlmBtn
        variant="outline"
        class="w-full"
        [disabled]="!filterHasValue()"
        (click)="clearForm()"
      >
        <ng-icon hlm name="lucideFilterX" size="sm" />
        Clear
      </button>
    </hlm-sheet-footer>
  </hlm-sheet-content>
</hlm-sheet>
